name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install Quicklisp
        run: |
          curl -L https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          echo "" | sbcl --non-interactive --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql:add-to-init-file)' \
            --eval '(quit)'

      - name: Install dependencies
        run: |
          sbcl --non-interactive --load install-deps.lisp --eval '(quit)'

      - name: Build executable
        run: make build

      - name: Rename binary
        run: mv stash stash-linux-x86_64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: stash-linux-x86_64
